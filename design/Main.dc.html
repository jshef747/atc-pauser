<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b5651d; } a:hover { color: #8f4f16; }
  </style>
</helmet>

<!-- BATC Pauser · Instrument mono -->
<div style="background: #e8e6e1; min-height: 700px; padding: 26px; box-sizing: border-box; font-family: 'IBM Plex Mono', ui-monospace, monospace; display: flex; justify-content: center;">
  <div style="width: 396px; background: #f7f6f3; border: 1.5px solid #1c1a17; box-shadow: 6px 6px 0 #1c1a1712;">

    <!-- titlebar -->
    <div style="display: flex; align-items: center; gap: 9px; padding: 9px 12px; background: #1c1a17; color: #f2efe9;">
      <span style="width: 8px; height: 8px; background: #d98a2b; flex: none;"></span>
      <span style="font-size: 11.5px; font-weight: 600; letter-spacing: .14em; flex-grow: 1;">BATC&nbsp;PAUSER</span>
      <span style="font-size: 10px; letter-spacing: .1em; color: #8f897d;">v1.2</span>
    </div>

    <div style="padding: 14px;">

      <!-- status grid -->
      <div style="border: 1px solid #cfccc4;">
        <div style="display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-bottom: 1px solid #cfccc4;">
          <span style="width: 7px; height: 7px; background: #2f9e52; flex: none;"></span>
          <span style="color: #6a665d; font-size: 11px; letter-spacing: .08em; width: 96px; flex: none;">MSFS&nbsp;2024</span>
          <span style="color: #1c1a17; font-size: 11px; font-weight: 600;">CONNECTED</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; padding: 8px 11px;">
          <span style="width: 7px; height: 7px; background: #2f9e52; flex: none;"></span>
          <span style="color: #6a665d; font-size: 11px; letter-spacing: .08em; width: 96px; flex: none;">BEYONDATC</span>
          <span style="color: #1c1a17; font-size: 11px; font-weight: 600;">LOG&nbsp;ACTIVE</span>
        </div>
      </div>

      <!-- simbrief + waypoint -->
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <div style="display: flex; align-items: stretch; gap: 8px;">
          <span style="color: #8f897d; font-size: 10px; letter-spacing: .1em; width: 62px; flex: none; align-self: center;">SIMBRIEF</span>
          <div style="flex-grow: 1; background: #fff; border: 1px solid #1c1a17; padding: 7px 10px; color: #1c1a17; font-size: 12px;">flord1</div>
          <div style="background: #1c1a17; color: #f2efe9; padding: 7px 15px; font-size: 11px; letter-spacing: .1em; display: flex; align-items: center;">LOAD</div>
        </div>
        <div style="display: flex; align-items: stretch; gap: 8px;">
          <span style="color: #8f897d; font-size: 10px; letter-spacing: .1em; width: 62px; flex: none; align-self: center;">PAUSE&nbsp;AT</span>
          <div style="flex-grow: 1; background: #fff; border: 1px solid #1c1a17; padding: 7px 10px; color: #1c1a17; font-size: 12px; display: flex; align-items: center; justify-content: space-between;">
            <span>HELEN <span style="color: #b5651d;">[DES]</span></span>
            <svg width="11" height="11" viewBox="0 0 12 12" stroke="#8f897d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
          </div>
        </div>
      </div>

      <!-- ARMED banner -->
      <div style="margin-top: 12px; border: 1.5px solid #1c1a17; background: #2f9e52; padding: 13px 14px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="color: #fff; font-size: 18px; font-weight: 700; letter-spacing: .22em;">ARMED</span>
          <span style="width: 9px; height: 9px; background: #fff; flex: none;"></span>
        </div>
        <div style="color: #dff1e5; font-size: 11px; letter-spacing: .04em; margin-top: 6px;">&gt; WILL PAUSE 5NM BEFORE HELEN</div>
      </div>

      <!-- last trigger -->
      <div style="margin-top: 12px; border: 1px solid #cfccc4;">
        <div style="display: flex; justify-content: space-between; padding: 7px 11px; border-bottom: 1px solid #cfccc4; background: #efece6;">
          <span style="color: #6a665d; font-size: 10px; letter-spacing: .1em;">LAST&nbsp;TRIGGER · <span style="color:#b5651d;">STAR</span></span>
          <span style="color: #8f897d; font-size: 10px;">14:32:07</span>
        </div>
        <div style="padding: 9px 11px; color: #35322c; font-size: 11.5px; line-height: 1.45;">Cleared HELEN1K arrival, runway 24.</div>
      </div>

      <!-- speed -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
        <span style="color: #8f897d; font-size: 10px; letter-spacing: .1em; width: 62px; flex: none;">SPEED</span>
        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; border: 1px solid #1c1a17;">
          <div style="text-align: center; padding: 8px 0; font-size: 12px; font-weight: 700; background: #d98a2b; color: #1c1a17; border-right: 1px solid #1c1a17;">1×</div>
          <div style="text-align: center; padding: 8px 0; font-size: 12px; background: #fff; color: #6a665d; border-right: 1px solid #1c1a17;">2×</div>
          <div style="text-align: center; padding: 8px 0; font-size: 12px; background: #fff; color: #6a665d;">4×</div>
        </div>
      </div>

      <!-- actions -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;">
        <div style="text-align: center; padding: 11px 0; font-size: 12px; letter-spacing: .1em; font-weight: 600; background: #1c1a17; color: #f2efe9;">PAUSE&nbsp;SIM</div>
        <div style="text-align: center; padding: 11px 0; font-size: 12px; letter-spacing: .1em; font-weight: 600; background: #f7f6f3; border: 1px solid #1c1a17; color: #1c1a17;">DISARM</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
